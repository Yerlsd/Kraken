name: Kraken Main Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch feature branch
        run: |
          git fetch origin ui/kraken-native-overhaul
          git switch --detach origin/ui/kraken-native-overhaul

          python3 <<'PY'
          from pathlib import Path

          path = Path('Mythic/Utilities/GameManager/Legendary/LegendaryInterface.swift')
          text = path.read_text()

          old = '''            var launchSession: LaunchSession?

            // uses legendary's native launch process
            switch platform {
            case .macOS:
                do {} // no environment variables need to be assembled.
            case .windows:
'''

          new = '''            let launchSession: LaunchSession?

            // uses legendary's native launch process
            switch platform {
            case .macOS:
                launchSession = nil
            case .windows:
'''

          if old not in text:
              raise SystemExit('Expected launchSession declaration block was not found; refusing to modify the file.')

          path.write_text(text.replace(old, new, 1))
          print('Applied safe let-based LaunchSession initialization.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Mythic/Utilities/GameManager/Legendary/LegendaryInterface.swift
          git commit -m 'Fix Swift 6 launch session capture'
          git push origin HEAD:ui/kraken-native-overhaul

      - name: Dispatch full build and tests for repaired branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref ui/kraken-native-overhaul

      - name: Remove temporary helper from main
        run: |
          git switch main
          git rm .github/workflows/kraken-main-repair.yml
          git commit -m 'Remove temporary CI repair helper'
          git push origin main
